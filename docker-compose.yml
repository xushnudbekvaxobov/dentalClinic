services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-boot-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dental_clinic
      SPRING_DATASOURCE_USERNAME: healer
      SPRING_DATASOURCE_PASSWORD: healer
    networks:
      - app-network
    depends_on:
        - db

  db:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: healer
      POSTGRES_PASSWORD: healer
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge





  cat > docker-compose.yml <<'YAML'
services:
  db:
    image: postgres:16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dental_clinic
      POSTGRES_USER: healer
      POSTGRES_PASSWORD: healer
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: xushnudbekvaxobov/dental_clinik:latest
    container_name: spring-boot-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dental_clinic
      SPRING_DATASOURCE_USERNAME: healer
      SPRING_DATASOURCE_PASSWORD: healer
      SERVER_PORT: 8080
    ports:
      - "80:8080"
    depends_on:
      - db

volumes:
  db_data:
  YAML